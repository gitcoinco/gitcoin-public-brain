name: Sync Gov

on:
  schedule:
    - cron: '45 6 * * *'   # nightly, 06:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync gov.gitcoin.co
        run: python scripts/sync_gov.py

      - name: Commit and push
        run: |
          git config user.name "gitcoin-brain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gov/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "gov sync: $(date -u +%Y-%m-%d)"
          # On rebase conflicts in synced files, prefer this run's output.
          git pull --rebase -X theirs origin main
          git push
